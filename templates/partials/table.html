{% if result.rows %}
<div class="table-wrap">
    <table class="data-table">
        <thead>
            <tr>
            {% for column in result.columns %}
                <th>{{ column }}</th>
            {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in result.rows %}
            <tr>
                {% for column in result.columns %}
                <td data-label="{{ column }}">{{ row[column] }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<div class="empty-state">
    <strong>No scored rows</strong>
    <p>The uploaded file did not return any preview rows.</p>
</div>
{% endif %}
