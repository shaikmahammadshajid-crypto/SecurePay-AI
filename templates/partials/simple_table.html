{% if rows %}
<div class="table-wrap">
    <table class="data-table">
        <thead>
            <tr>
            {% for key in rows[0].keys() %}
                <th>{{ key|replace("_", " ")|title }}</th>
            {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                {% for key, value in row.items() %}
                <td data-label="{{ key|replace('_', ' ')|title }}">{{ value }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<div class="empty-state">
    <strong>No records yet</strong>
    <p>No rows are available for this view.</p>
</div>
{% endif %}
