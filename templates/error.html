{% extends "base.html" %}

{% block content %}
<section class="hero compact">
    <div>
        <span class="kicker">Error {{ error_code }}</span>
        <h1>{{ error_title }}</h1>
        <p>{{ error_message }}</p>
    </div>
    <div class="hero-actions">
        <a class="button-link" href="{{ url_for(home_endpoint) }}">Return Home</a>
        <a class="button-link secondary" href="{{ url_for('health') }}">Health Status</a>
    </div>
</section>
{% endblock %}
